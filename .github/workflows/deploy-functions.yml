name: Deploy Backend to Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# Un seul deploiement de fonctions a la fois. Deux `firebase deploy` simultanes
# sur le meme projet font echouer une partie des fonctions avec un laconique
# "failed to update function" : Google refuse de modifier une fonction pendant
# qu'une autre operation est en cours dessus.
concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install dependencies
        working-directory: ./functions
        run: npm ci

      # Expéditeur des mails (variable de dépôt GitHub, pas un secret).
      # Sans elle, les fonctions retombent sur onboarding@resend.dev, qui
      # n'envoie qu'au propriétaire du compte Resend.
      - name: Write functions env
        working-directory: ./functions
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          if [ -n "$EMAIL_FROM" ]; then
            printf 'EMAIL_FROM="%s"\n' "$EMAIL_FROM" > .env
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only functions,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
